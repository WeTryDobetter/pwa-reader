<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>墨韵书阁 · 私人书架阅读器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans', system-ui, -apple-system, 'Microsoft YaHei', sans-serif;
            background: #2b2b2b;
            transition: background 0.2s ease;
        }

        .app-container {
            display: flex;
            height: 100%;
            width: 100%;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* 侧边栏增强 - 滚动区域自适应 */
        .sidebar {
            width: 300px;
            background: rgba(30, 30, 35, 0.95);
            backdrop-filter: blur(4px);
            border-right: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            transition: all 0.2s;
            z-index: 10;
            overflow-y: auto;
            box-shadow: 2px 0 12px rgba(0,0,0,0.2);
        }

        .sidebar::-webkit-scrollbar {
            width: 5px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #5a5a5a;
            border-radius: 8px;
        }

        .sidebar-section {
            padding: 1rem 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 书架 & 历史 列表样式 */
        .books-list, .history-list {
            list-style: none;
            max-height: 220px;
            overflow-y: auto;
        }
        .book-item, .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.05);
            margin-bottom: 6px;
            padding: 6px 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.1s;
        }
        .book-item:hover, .history-item:hover {
            background: rgba(255,255,255,0.15);
        }
        .book-info, .history-info {
            flex: 1;
            overflow: hidden;
        }
        .book-name, .history-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: #e2e2e2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .book-meta, .history-time {
            font-size: 0.65rem;
            color: #9a9aaa;
        }
        .del-book, .del-history {
            background: none;
            border: none;
            color: #bc8f6b;
            cursor: pointer;
            font-size: 1rem;
            padding: 0 6px;
            opacity: 0.6;
        }
        .del-book:hover, .del-history:hover {
            opacity: 1;
            color: #ff9f6e;
        }
        .empty-tip-small {
            color: #8a8a98;
            font-size: 0.75rem;
            text-align: center;
            padding: 12px 0;
        }

        /* 原有目录样式 */
        .toc-list {
            list-style: none;
            margin-top: 8px;
            max-height: 280px;
            overflow-y: auto;
        }
        .toc-item {
            padding: 6px 10px;
            font-size: 0.8rem;
            color: #cdcdcd;
            cursor: pointer;
            border-radius: 10px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .toc-item:hover {
            background: #3e3e48;
        }
        .toc-item.active-chapter {
            background: #5c4b6e;
            color: white;
            border-left: 3px solid #e2b8ff;
        }

        /* 文件区按钮等原有样式 */
        .file-btn {
            background: #3a3a44;
            border: none;
            padding: 8px 12px;
            border-radius: 12px;
            color: white;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            text-align: center;
            margin-bottom: 8px;
        }
        .encoding-select {
            background: #2a2a30;
            border: 1px solid #4a4a55;
            border-radius: 12px;
            padding: 7px 10px;
            color: #ddd;
            width: 100%;
        }
        .font-control, .theme-group {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }
        .theme-group button {
            flex: 1;
            background: #2c2c34;
            border: none;
            padding: 6px;
            border-radius: 28px;
            color: #ccc;
            cursor: pointer;
        }
        .theme-btn.active {
            background: #6c5b7b;
            color: white;
        }

        /* 右侧阅读区 */
        .reader {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fef9e8;
            transition: background 0.2s, color 0.2s;
            overflow: hidden;
        }
        .reader-header {
            padding: 12px 24px;
            background: inherit;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }
        .content-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 40px 80px 40px;
            scroll-behavior: smooth;
        }
        .paragraph {
            margin-bottom: 1.2em;
            line-height: 1.75;
            font-size: 1rem;
            text-align: justify;
            word-break: break-word;
        }
        .chapter-title {
            font-weight: 700;
            font-size: 1.45em;
            margin: 1.2em 0 0.6em 0;
            color: #c47b4a;
            border-left: 4px solid #c47b4a;
            padding-left: 16px;
        }
        .progress-bar-area {
            background: rgba(0,0,0,0.03);
            padding: 8px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .progress-slider {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            background: #ddd2c0;
        }
        /* 主题变体 */
        body.theme-dark .reader { background: #1e1e24; }
        body.theme-dark .paragraph { color: #e2e2e4; }
        body.theme-dark .chapter-title { color: #d9a56c; }
        body.theme-sepia .reader { background: #fbf5e8; }
        body.theme-sepia .paragraph { color: #5c4b3a; }
        .drop-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s;
        }
        .drop-overlay.show { opacity: 1; }
        button { background: none; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="sidebar">
        <!-- 文件操作区 -->
        <div class="sidebar-section">
            <div class="sidebar-title">📖 书阁</div>
            <button id="openFileBtn" class="file-btn">📂 打开TXT小说</button>
            <input type="file" id="fileInput" accept=".txt" style="display: none;" />
            <select id="encodingSelect" class="encoding-select">
                <option value="UTF-8">UTF-8</option>
                <option value="GBK">GBK</option>
                <option value="GB2312">GB2312</option>
            </select>
            <div style="font-size: 11px; color:#aaa; margin-top:6px; text-align:center;">支持拖拽TXT文件</div>
        </div>

        <!-- 我的书架 -->
        <div class="sidebar-section">
            <div class="sidebar-title">📚 我的书架</div>
            <div id="bookshelfContainer">
                <ul id="bookshelfList" class="books-list">
                    <li class="empty-tip-small">暂无藏书，打开小说自动加入书架</li>
                </ul>
            </div>
        </div>

        <!-- 历史记录 -->
        <div class="sidebar-section">
            <div class="sidebar-title">🕒 最近阅读</div>
            <div id="historyContainer">
                <ul id="historyList" class="history-list">
                    <li class="empty-tip-small">暂无阅读记录</li>
                </ul>
            </div>
        </div>

        <!-- 章节导航 -->
        <div class="sidebar-section">
            <div class="sidebar-title">📑 章节导航</div>
            <div id="tocContainer">
                <ul id="tocList" class="toc-list">
                    <li style="color:#aaa; padding:8px;">请打开书籍</li>
                </ul>
            </div>
        </div>

        <!-- 个性化 -->
        <div class="sidebar-section">
            <div class="sidebar-title">🎨 阅读主题</div>
            <div class="theme-group">
                <button data-theme="light" class="theme-btn active">浅色</button>
                <button data-theme="sepia" class="theme-btn">羊皮纸</button>
                <button data-theme="dark" class="theme-btn">暗夜</button>
            </div>
            <div class="font-control" style="margin-top:12px;">
                <button id="fontMinus">A-</button>
                <span id="fontSizeValue">16px</span>
                <button id="fontPlus">A+</button>
            </div>
        </div>
    </div>

    <div class="reader">
        <div class="reader-header">
            <div class="file-info" id="fileNameDisplay">📭 未打开书籍</div>
            <div class="stats" id="statsDisplay">字数: -- | 段落: --</div>
        </div>
        <div class="content-container" id="contentContainer">
            <div class="empty-tip" style="text-align:center; margin-top:20%;">✨ 墨韵书阁 ✨<br/>点击「打开TXT小说」或从书架选取书籍</div>
        </div>
        <div class="progress-bar-area">
            <span style="font-size:12px;">📌 阅读进度</span>
            <input type="range" id="progressSlider" class="progress-slider" min="0" max="100" value="0">
            <span id="progressPercent" class="progress-percent">0%</span>
        </div>
    </div>
</div>
<div id="dropOverlay" class="drop-overlay">📂 释放文件以添加至书架</div>

<script>
    // ----------------------------- IndexedDB 管理 (书架+历史记录) -----------------------------
    const DB_NAME = 'MoYunReaderDB';
    const DB_VERSION = 2;
    const STORE_BOOKS = 'books';

    let db = null;
    let currentBookId = null;          // 当前打开的书籍ID
    let currentParagraphs = [];         // 当前书籍段落数组 [{text, isTitle}]
    let currentFontSize = 16;
    let scrollListenerAttached = false;
    let isProgressDragging = false;
    let currentStats = { chars: 0, paras: 0 };

    // 初始化数据库
    function initDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
                db = request.result;
                resolve(db);
            };
            request.onupgradeneeded = (e) => {
                const dbRef = e.target.result;
                if (!dbRef.objectStoreNames.contains(STORE_BOOKS)) {
                    const store = dbRef.createObjectStore(STORE_BOOKS, { keyPath: 'id', autoIncrement: true });
                    store.createIndex('by_lastReadTime', 'lastReadTime', { unique: false });
                    store.createIndex('by_name', 'name');
                }
            };
        });
    }

    // 添加或更新书籍 (如果已存在相同文件名+大小则更新内容，否则新增)
    async function saveOrUpdateBook(fileName, rawText, encoding, fileSize, lastModified) {
        const uniqueKey = `${fileName}_${fileSize}_${lastModified}`;
        // 检查是否已存在
        const existing = await findBookByUniqueKey(uniqueKey);
        const now = Date.now();
        const bookData = {
            name: fileName,
            rawText: rawText,
            encoding: encoding,
            fileSize: fileSize,
            lastModified: lastModified,
            uniqueKey: uniqueKey,
            lastReadIndex: 0,          // 段落索引
            lastReadTime: now,
            createTime: existing ? existing.createTime : now
        };
        if (existing) {
            bookData.id = existing.id;
            bookData.lastReadIndex = existing.lastReadIndex; // 保留原有进度
        }
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_BOOKS, 'readwrite');
            const store = tx.objectStore(STORE_BOOKS);
            const request = existing ? store.put(bookData) : store.add(bookData);
            request.onsuccess = () => {
                const id = existing ? existing.id : request.result;
                resolve({ id, ...bookData });
            };
            request.onerror = () => reject(request.error);
        });
    }

    async function findBookByUniqueKey(uniqueKey) {
        return new Promise((resolve) => {
            const tx = db.transaction(STORE_BOOKS, 'readonly');
            const store = tx.objectStore(STORE_BOOKS);
            const all = store.getAll();
            all.onsuccess = () => {
                const books = all.result;
                const found = books.find(b => b.uniqueKey === uniqueKey);
                resolve(found || null);
            };
            all.onerror = () => resolve(null);
        });
    }

    // 获取所有书籍 (按最后阅读时间倒序)
    async function getAllBooks() {
        return new Promise((resolve) => {
            const tx = db.transaction(STORE_BOOKS, 'readonly');
            const store = tx.objectStore(STORE_BOOKS);
            const index = store.index('by_lastReadTime');
            const request = index.openCursor(null, 'prev');
            const books = [];
            request.onsuccess = (e) => {
                const cursor = e.target.result;
                if (cursor) {
                    books.push(cursor.value);
                    cursor.continue();
                } else {
                    resolve(books);
                }
            };
            request.onerror = () => resolve([]);
        });
    }

    // 更新阅读进度
    async function updateBookProgress(bookId, lastReadIndex) {
        if (!bookId) return;
        const tx = db.transaction(STORE_BOOKS, 'readwrite');
        const store = tx.objectStore(STORE_BOOKS);
        const getReq = store.get(bookId);
        getReq.onsuccess = () => {
            const book = getReq.result;
            if (book) {
                book.lastReadIndex = lastReadIndex;
                book.lastReadTime = Date.now();
                store.put(book);
                // 刷新书架和历史UI
                refreshBookshelfAndHistory();
            }
        };
    }

    // 删除书籍
    async function deleteBook(bookId) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_BOOKS, 'readwrite');
            const store = tx.objectStore(STORE_BOOKS);
            const req = store.delete(bookId);
            req.onsuccess = () => {
                if (currentBookId === bookId) {
                    // 清空当前阅读区域
                    currentBookId = null;
                    currentParagraphs = [];
                    renderEmptyReader();
                }
                refreshBookshelfAndHistory();
                resolve();
            };
            req.onerror = reject;
        });
    }

    // 根据ID加载书籍原始文本并解析
    async function loadBookById(bookId) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_BOOKS, 'readonly');
            const store = tx.objectStore(STORE_BOOKS);
            const req = store.get(bookId);
            req.onsuccess = () => {
                const book = req.result;
                if (book) resolve(book);
                else reject('书籍不存在');
            };
            req.onerror = reject;
        });
    }

    // 解析文本为段落
    function parseTextToParagraphs(rawText) {
        const lines = rawText.split(/\r?\n/);
        const result = [];
        for (let line of lines) {
            let trimmed = line.trim();
            if (trimmed === "") {
                result.push({ text: line, isTitle: false });
            } else {
                const isTitle = /^(第[一二三四五六七八九十百千万0-9零〇]+[章回节集卷篇])|(楔子|尾声|序言|后记|引子)/i.test(trimmed);
                result.push({ text: line, isTitle: isTitle });
            }
        }
        return result;
    }

    // 渲染正文 (基于currentParagraphs)
    function renderContent() {
        const container = document.getElementById('contentContainer');
        if (!currentParagraphs.length) {
            container.innerHTML = '<div class="empty-tip" style="text-align:center; margin-top:20%;">📭 暂无内容，请打开书籍</div>';
            document.getElementById('statsDisplay').innerText = '字数: -- | 段落: --';
            return;
        }
        const fragment = document.createDocumentFragment();
        const wrapper = document.createElement('div');
        for (let p of currentParagraphs) {
            const div = document.createElement('div');
            div.className = 'paragraph';
            if (p.isTitle) div.classList.add('chapter-title');
            div.textContent = p.text;
            wrapper.appendChild(div);
        }
        container.innerHTML = '';
        container.appendChild(wrapper);
        // 统计
        let totalChars = currentParagraphs.reduce((sum, p) => sum + p.text.length, 0);
        document.getElementById('statsDisplay').innerText = `字数: ${totalChars.toLocaleString()} | 段落: ${currentParagraphs.length}`;
        // 应用字体
        document.querySelectorAll('.paragraph').forEach(p => p.style.fontSize = `${currentFontSize}px`);
        // 渲染目录
        renderToc();
        // 绑定滚动事件
        attachScrollListener();
        // 恢复上次阅读进度
        if (currentBookId) {
            loadBookById(currentBookId).then(book => {
                let savedIndex = book.lastReadIndex || 0;
                if (savedIndex >= currentParagraphs.length) savedIndex = 0;
                setTimeout(() => {
                    scrollToParagraph(savedIndex);
                    updateProgressByScrollPosition();
                }, 60);
            }).catch(()=>{});
        }
    }

    function renderToc() {
        const tocUl = document.getElementById('tocList');
        tocUl.innerHTML = '';
        let titleIndices = [];
        for (let i = 0; i < currentParagraphs.length; i++) {
            if (currentParagraphs[i].isTitle) titleIndices.push({ idx: i, text: currentParagraphs[i].text.trim() });
        }
        if (titleIndices.length === 0) {
            tocUl.innerHTML = '<li style="color:#aaa; padding:8px;">无章节标题</li>';
            return;
        }
        for (let t of titleIndices) {
            const li = document.createElement('li');
            li.className = 'toc-item';
            li.setAttribute('data-para-idx', t.idx);
            li.textContent = t.text.length > 28 ? t.text.slice(0,25)+'…' : t.text;
            li.addEventListener('click', (e) => {
                scrollToParagraph(t.idx);
                setTimeout(() => highlightCurrentChapterInToc(), 50);
            });
            tocUl.appendChild(li);
        }
    }

    function highlightCurrentChapterInToc() {
        const items = document.querySelectorAll('.toc-item');
        if (!items.length) return;
        let activeIdx = -1;
        for (let i = currentParagraphs.length-1; i >= 0; i--) {
            if (currentParagraphs[i] && currentParagraphs[i].isTitle) {
                activeIdx = i;
                break;
            }
        }
        items.forEach(item => {
            const paraIdx = parseInt(item.getAttribute('data-para-idx'));
            if (paraIdx === activeIdx) item.classList.add('active-chapter');
            else item.classList.remove('active-chapter');
        });
    }

    function scrollToParagraph(index) {
        const paras = document.querySelectorAll('.paragraph');
        if (paras.length && index >= 0 && index < paras.length) {
            paras[index].scrollIntoView({ behavior: 'smooth', block: 'start' });
            currentParagraphIndex = index;
            updateProgressByScrollPosition();
            if (currentBookId) updateBookProgress(currentBookId, index);
        }
    }

    let currentParagraphIndex = 0;
    function updateProgressByScrollPosition() {
        const paras = document.querySelectorAll('.paragraph');
        if (!paras.length) return;
        const containerRect = document.getElementById('contentContainer').getBoundingClientRect();
        let bestIndex = 0;
        let bestDist = Infinity;
        for (let i = 0; i < paras.length; i++) {
            const rect = paras[i].getBoundingClientRect();
            const dist = Math.abs(rect.top - containerRect.top);
            if (dist < bestDist) { bestDist = dist; bestIndex = i; }
        }
        if (bestIndex !== currentParagraphIndex) {
            currentParagraphIndex = bestIndex;
            if (currentBookId) updateBookProgress(currentBookId, currentParagraphIndex);
            highlightCurrentChapterInToc();
        }
        const percent = paras.length ? Math.floor((currentParagraphIndex / (paras.length-1)) * 100) : 0;
        if (!isProgressDragging) {
            document.getElementById('progressSlider').value = percent;
            document.getElementById('progressPercent').innerText = `${percent}%`;
        }
    }

    function attachScrollListener() {
        if (scrollListenerAttached) return;
        const container = document.getElementById('contentContainer');
        container.addEventListener('scroll', () => {
            if (!isProgressDragging) requestAnimationFrame(() => updateProgressByScrollPosition());
        });
        scrollListenerAttached = true;
    }

    function renderEmptyReader() {
        document.getElementById('fileNameDisplay').innerText = '📭 未打开书籍';
        document.getElementById('contentContainer').innerHTML = '<div class="empty-tip" style="text-align:center; margin-top:20%;">✨ 选择书籍开始阅读 ✨</div>';
        document.getElementById('statsDisplay').innerText = '字数: -- | 段落: --';
        document.getElementById('tocList').innerHTML = '<li style="color:#aaa; padding:8px;">暂无目录</li>';
        currentParagraphs = [];
        currentBookId = null;
    }

    // 打开书籍（根据ID）
    async function openBookById(bookId) {
        try {
            const book = await loadBookById(bookId);
            currentBookId = book.id;
            document.getElementById('fileNameDisplay').innerHTML = `📖 ${book.name}`;
            const paragraphs = parseTextToParagraphs(book.rawText);
            currentParagraphs = paragraphs;
            renderContent();
            // 更新最后阅读时间
            await updateBookProgress(book.id, book.lastReadIndex || 0);
            refreshBookshelfAndHistory();
        } catch(e) { console.error(e); alert('打开书籍失败'); }
    }

    // 新增书籍流程：读文件 -> 存入IndexedDB -> 打开
    async function addBookFromFile(file, encoding) {
        const reader = new FileReader();
        reader.onload = async (e) => {
            const rawText = e.target.result;
            const fileName = file.name;
            const fileSize = file.size;
            const lastModified = file.lastModified;
            const saved = await saveOrUpdateBook(fileName, rawText, encoding, fileSize, lastModified);
            await openBookById(saved.id);
            refreshBookshelfAndHistory();
        };
        reader.onerror = () => alert('文件读取失败');
        reader.readAsText(file, encoding);
    }

    // 刷新书架和历史UI
    async function refreshBookshelfAndHistory() {
        const allBooks = await getAllBooks();
        const bookshelfUl = document.getElementById('bookshelfList');
        const historyUl = document.getElementById('historyList');
        if (allBooks.length === 0) {
            bookshelfUl.innerHTML = '<li class="empty-tip-small">暂无藏书，打开小说自动加入书架</li>';
            historyUl.innerHTML = '<li class="empty-tip-small">暂无阅读记录</li>';
            return;
        }
        // 书架：全部
        bookshelfUl.innerHTML = '';
        for (let book of allBooks) {
            const li = document.createElement('li');
            li.className = 'book-item';
            li.innerHTML = `
                <div class="book-info" data-id="${book.id}">
                    <div class="book-name">${escapeHtml(book.name)}</div>
                    <div class="book-meta">${new Date(book.lastReadTime).toLocaleDateString()}</div>
                </div>
                <button class="del-book" data-id="${book.id}">🗑️</button>
            `;
            li.querySelector('.book-info').addEventListener('click', (e) => {
                e.stopPropagation();
                openBookById(book.id);
            });
            li.querySelector('.del-book').addEventListener('click', async (e) => {
                e.stopPropagation();
                if(confirm(`从书架删除《${book.name}》？`)) await deleteBook(book.id);
            });
            bookshelfUl.appendChild(li);
        }
        // 历史：最近阅读前8条（去重书架按时间）
        const historyList = [...allBooks].sort((a,b)=>b.lastReadTime - a.lastReadTime).slice(0,8);
        historyUl.innerHTML = '';
        if(historyList.length===0) historyUl.innerHTML = '<li class="empty-tip-small">暂无阅读记录</li>';
        for (let book of historyList) {
            const li = document.createElement('li');
            li.className = 'history-item';
            li.innerHTML = `
                <div class="history-info" data-id="${book.id}">
                    <div class="history-name">${escapeHtml(book.name)}</div>
                    <div class="history-time">${formatRelativeTime(book.lastReadTime)}</div>
                </div>
                <button class="del-history" data-id="${book.id}">✖</button>
            `;
            li.querySelector('.history-info').addEventListener('click', () => openBookById(book.id));
            li.querySelector('.del-history').addEventListener('click', async (e) => {
                e.stopPropagation();
                if(confirm(`从记录中删除《${book.name}》？书籍仍保留在书架`)) {
                    // 只删除书籍相当于完全删除，但需求上历史记录删除通常只移除记录? 用户预期删除书籍同时从书架移除，但更合理: 点击删除书籍时移除；历史记录里的删除也同样调用删除书籍
                    await deleteBook(book.id);
                }
            });
            historyUl.appendChild(li);
        }
    }

    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    function formatRelativeTime(timestamp) {
        const diff = Date.now() - timestamp;
        if(diff < 3600000) return '刚刚';
        if(diff < 86400000) return `${Math.floor(diff/3600000)}小时前`;
        return `${Math.floor(diff/86400000)}天前`;
    }

    // 字体与主题
    function setFontSize(delta) {
        let newSize = currentFontSize + delta;
        if (newSize < 12) newSize = 12;
        if (newSize > 28) newSize = 28;
        currentFontSize = newSize;
        document.getElementById('fontSizeValue').innerText = `${currentFontSize}px`;
        document.querySelectorAll('.paragraph').forEach(p => p.style.fontSize = `${currentFontSize}px`);
    }
    function setTheme(theme) {
        document.body.classList.remove('theme-dark', 'theme-sepia');
        if (theme === 'dark') document.body.classList.add('theme-dark');
        if (theme === 'sepia') document.body.classList.add('theme-sepia');
        localStorage.setItem('readerTheme', theme);
        document.querySelectorAll('.theme-btn').forEach(btn => {
            if(btn.getAttribute('data-theme')===theme) btn.classList.add('active');
            else btn.classList.remove('active');
        });
    }

    // 事件绑定 + 拖拽
    function bindEvents() {
        document.getElementById('openFileBtn').addEventListener('click', () => document.getElementById('fileInput').click());
        document.getElementById('fileInput').addEventListener('change', (e) => {
            if(e.target.files.length) addBookFromFile(e.target.files[0], document.getElementById('encodingSelect').value);
        });
        document.getElementById('encodingSelect').addEventListener('change', () => {});
        document.getElementById('fontMinus').addEventListener('click', () => setFontSize(-1));
        document.getElementById('fontPlus').addEventListener('click', () => setFontSize(1));
        const progressSlider = document.getElementById('progressSlider');
        progressSlider.addEventListener('input', (e) => {
            if(!currentParagraphs.length) return;
            isProgressDragging = true;
            const val = parseInt(e.target.value);
            document.getElementById('progressPercent').innerText = `${val}%`;
        });
        progressSlider.addEventListener('change', (e) => {
            if(!currentParagraphs.length) { isProgressDragging=false; return; }
            const val = parseInt(e.target.value);
            const targetIdx = Math.floor((val/100)*(currentParagraphs.length-1));
            scrollToParagraph(Math.min(currentParagraphs.length-1, Math.max(0,targetIdx)));
            isProgressDragging = false;
            updateProgressByScrollPosition();
        });
        document.querySelectorAll('.theme-btn').forEach(btn => btn.addEventListener('click', () => setTheme(btn.getAttribute('data-theme'))));
        // 拖拽
        const overlay = document.getElementById('dropOverlay');
        document.body.addEventListener('dragover', (e) => { e.preventDefault(); overlay.classList.add('show'); });
        document.body.addEventListener('dragleave', () => overlay.classList.remove('show'));
        document.body.addEventListener('drop', async (e) => {
            e.preventDefault(); overlay.classList.remove('show');
            const file = e.dataTransfer.files[0];
            if(file && file.name.endsWith('.txt')) {
                addBookFromFile(file, document.getElementById('encodingSelect').value);
            } else alert('请拖拽 .txt 文件');
        });
    }

    // 初始化加载书架并恢复主题
    window.addEventListener('load', async () => {
        await initDB();
        bindEvents();
        const savedTheme = localStorage.getItem('readerTheme');
        if(savedTheme) setTheme(savedTheme);
        else setTheme('light');
        await refreshBookshelfAndHistory();
        // 尝试打开最近阅读的一本
        const books = await getAllBooks();
        if(books.length) openBookById(books[0].id);
        else renderEmptyReader();
        attachScrollListener();
    });
</script>
</body>
</html>
